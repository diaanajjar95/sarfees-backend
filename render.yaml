databases:
  - name: sarfees-db
    plan: free
    databaseName: sarfees_db
    user: sarfees_user

services:
  - type: web
    name: sarfees-api
    runtime: docker
    plan: free
    envVars:
      # ─── Database (Render injects values from the named database) ─────
      - key: DB_HOST
        fromDatabase:
          name: sarfees-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sarfees-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: sarfees-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sarfees-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: sarfees-db
          property: database

      # ─── Runtime ─────────────────────────────────────────────────────
      # Production gate: disables the dev-only POST /admin/dev/driver-trips
      # seeder and switches Next.js cookies to Secure mode.
      - key: NODE_ENV
        value: production

      # ─── Passenger app JWTs ──────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ─── Driver app JWTs ─────────────────────────────────────────────
      - key: JWT_DRIVER_ACCESS_SECRET
        generateValue: true
      - key: JWT_DRIVER_REFRESH_SECRET
        generateValue: true

      # ─── Admin portal JWTs ───────────────────────────────────────────
      # TTLs default to 30m access / 7d refresh in code — leave unset in prod.
      - key: JWT_ADMIN_ACCESS_SECRET
        generateValue: true
      - key: JWT_ADMIN_REFRESH_SECRET
        generateValue: true

      # ─── CORS for the admin portal ───────────────────────────────────
      # Comma-separated list of origins. Replace with the real admin portal
      # URL once it's deployed (Vercel / Render Static / etc).
      - key: ADMIN_PORTAL_ORIGIN
        value: https://sarfees-admin.example.com

      # ─── Auto-matcher ────────────────────────────────────────────────
      - key: MATCHING_ENABLED
        value: "true"

      # ─── Mobile app version gating (used by GET /app/init + force-update) ─
      - key: IOS_LATEST_VERSION
        value: 1.0.0
      - key: IOS_MIN_VERSION
        value: 1.0.0
      - key: IOS_STORE_URL
        value: https://apps.apple.com/app/idPLACEHOLDER
      - key: ANDROID_LATEST_VERSION
        value: 1.0.0
      - key: ANDROID_MIN_VERSION
        value: 1.0.0
      - key: ANDROID_STORE_URL
        value: https://play.google.com/store/apps/details?id=PLACEHOLDER

      # ─── Legal / support links ───────────────────────────────────────
      - key: TERMS_URL
        value: https://sarfees.com/legal/terms
      - key: PRIVACY_URL
        value: https://sarfees.com/legal/privacy
      - key: SUPPORT_EMAIL
        value: support@sarfees.com

      # ─── Suspension policy thresholds (home-summary.suspensionInfo) ──
      - key: DRIVER_MIN_RATING
        value: "4.0"
      - key: DRIVER_REVIEW_MIN_DAYS
        value: "1"
      - key: DRIVER_REVIEW_MAX_DAYS
        value: "3"

      # ─── Runtime feature flags ───────────────────────────────────────
      - key: MAINTENANCE_MODE
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: en
      - key: SUPPORTED_LANGUAGES
        value: en,ar

      # ─── Map provider (Mapbox in prod; Haversine locally) ────────────
      # Get MAPBOX_ACCESS_TOKEN from the Mapbox dashboard, scope it to
      # Directions + Matrix APIs, and paste into the Render dashboard
      # secrets — do NOT commit real tokens here.
      - key: MAP_PROVIDER
        value: mapbox
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: MAPBOX_BASE_URL
        value: https://api.mapbox.com
      - key: MAP_CACHE_MAX_ENTRIES
        value: "10000"
      - key: MAP_CACHE_TTL_HOURS
        value: "24"
      - key: MAP_PROVIDER_FALLBACK
        value: haversine

      # ─── Matching engine thresholds (§14 of the master spec) ─────────
      - key: MATCHING_MAX_GROUP_SIZE
        value: "4"
      - key: MATCHING_SERVICE_RADIUS_METERS
        value: "5000"
      - key: MATCHING_DETOUR_BOUND_PERCENT
        value: "20"
      - key: MATCHING_MIXED_PASSENGER_MIN
        value: "2"
      - key: MATCHING_MIXED_PASSENGER_MAX
        value: "3"
      - key: MATCHING_MIXED_PACKAGE_MIN
        value: "3"
      - key: MATCHING_MIXED_PACKAGE_MAX
        value: "5"
      - key: MATCHING_PACKAGES_ONLY_MIN
        value: "7"
      - key: MATCHING_PACKAGES_ONLY_MAX
        value: "15"
      - key: MATCHING_SLOT_S
        value: "1"
      - key: MATCHING_SLOT_M
        value: "2"
      - key: MATCHING_SLOT_L
        value: "3"
      - key: MATCHING_PASSENGER_WAIT_TOLERANCE_MIN
        value: "12"
      - key: MATCHING_PACKAGE_WAIT_TOLERANCE_MIN
        value: "12"
      - key: MATCHING_HANDLING_SEC_PER_PACKAGE
        value: "300"
      - key: MATCHING_OFFER_COUNTDOWN_SEC
        value: "30"
      - key: MATCHING_DRIVER_SEARCH_LEAD_MIN
        value: "30"
      - key: MATCHING_NOW_WINDOW_MIN_MIN
        value: "15"
      - key: MATCHING_NOW_WINDOW_MAX_MIN
        value: "30"
      - key: MATCHING_SWEEP_INTERVAL_SEC
        value: "30"
      - key: MATCHING_URGENT_EARLY_BROADCAST_DECLINES
        value: "3"
      - key: MATCHING_BROADCAST_TRIGGER_DECLINE_COUNT
        value: "5"
      - key: MATCHING_DECLINE_PENALTY_BASE
        value: "10"
      - key: MATCHING_DECLINE_PENALTY_DECAY_DAYS
        value: "7"
      - key: MATCHING_DRIVER_CANCEL_PENALTY
        value: "15"
      - key: MATCHING_RECIPIENT_GRACE_MIN
        value: "10"
      - key: MATCHING_SENDER_NOSHOW_GRACE_MIN
        value: "7"
      - key: MATCHING_ASSIGNED_DRIVER_OFFLINE_GRACE_MIN
        value: "5"
      - key: MATCHING_CANCELLATION_FEE_JOD_CENTS
        value: "200"
      - key: MATCHING_NO_SHOW_FEE_JOD_CENTS
        value: "300"
      - key: MATCHING_RETURN_REDELIVERY_FEE_JOD_CENTS
        value: "500"
      - key: MATCHING_FULL_CAR_DISCOUNT_PERCENT
        value: "10"
      - key: MATCHING_GOING_HOME_DAY_BOUNDARY_HOUR
        value: "0"

      # ─── Vehicle-class capacity defaults (seeded to vehicle_class_capacity) ─
      - key: VEHICLE_CAP_SEDAN_TRUNK_SLOTS
        value: "6"
      - key: VEHICLE_CAP_SEDAN_WEIGHT_KG
        value: "50"
      - key: VEHICLE_CAP_SEDAN_SEAT_SLOT
        value: "2"
      - key: VEHICLE_CAP_SUV_TRUNK_SLOTS
        value: "9"
      - key: VEHICLE_CAP_SUV_WEIGHT_KG
        value: "90"
      - key: VEHICLE_CAP_SUV_SEAT_SLOT
        value: "3"
      - key: VEHICLE_CAP_PICKUP_TRUNK_SLOTS
        value: "15"
      - key: VEHICLE_CAP_PICKUP_WEIGHT_KG
        value: "200"
      - key: VEHICLE_CAP_PICKUP_SEAT_SLOT
        value: "3"
