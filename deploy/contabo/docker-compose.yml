# Sarfees API — Contabo production stack
#
# Services:
#   postgres   Postgres 15 with a named volume for durability.
#   api        NestJS backend built from the repo-root Dockerfile.
#   caddy      Reverse proxy on :80/:443 with automatic Let's Encrypt.
#
# Bring the stack up with `docker compose up -d --build`.
# See deploy/contabo/README.md for the full walkthrough.

services:
  postgres:
    image: postgres:15-alpine
    container_name: sarfees-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount for pg_dump restore work — see 04-restore-db.sh
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sarfees-net

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: sarfees-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Service points at the postgres container over the internal
      # docker network — no need for SSL between containers.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: "false"
      NODE_ENV: production
      PORT: "3000"
      # All other config comes from .env (JWT secrets, thresholds,
      # support contacts, app-init version fields, etc.)
    env_file:
      - .env
    volumes:
      # Persist uploaded driver documents + profile photos across
      # redeploys. Ephemeral in-container storage would lose them.
      - uploads_data:/app/uploads
    networks:
      - sarfees-net

  admin-portal:
    build:
      context: ../../admin-portal
      dockerfile: Dockerfile
    container_name: sarfees-admin-portal
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server-side calls from the Next.js proxy routes hit the api
      # container over the internal docker network. Browser calls come
      # in via Caddy (same-origin /api/* → proxy routes → this env).
      SARFEES_API_URL: http://api:3000
      SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_ACCESS_TTL_SECONDS: "2592000"
      ADMIN_REFRESH_TTL_SECONDS: "2592000"
      NODE_ENV: production
      # We're serving the admin portal over plain HTTP on :8080 until
      # DNS + Let's Encrypt are wired up. Browsers won't send Secure
      # cookies over HTTP, so the session cookie would round-trip once
      # and then be dropped — flip this to "true" the moment the site
      # is behind HTTPS (named-domain Caddy block).
      COOKIE_SECURE: "false"
      PORT: "3001"
    networks:
      - sarfees-net

  caddy:
    image: caddy:2-alpine
    container_name: sarfees-caddy
    restart: unless-stopped
    depends_on:
      - api
      - admin-portal
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sarfees-net

  # Self-hosted OSRM for real road distances. One-time data prep:
  #   bash scripts/osrm-prepare-vps.sh
  # (mirrors scripts/osrm-prepare.sh from the repo root — writes
  # jordan-latest.osrm files into ./osrm-data). After the prep runs,
  # start OSRM: `docker compose up -d osrm` and set MAP_PROVIDER=osrm
  # + OSRM_BASE_URL=http://osrm:5000 in .env.
  osrm:
    image: osrm/osrm-backend:latest
    container_name: sarfees-osrm
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: >
      osrm-routed --algorithm mld
      --max-table-size 200
      /data/jordan-latest.osrm
    networks:
      - sarfees-net

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  sarfees-net:
    driver: bridge
